name: Node.js Docker CI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::966127383941:role/GitHubActions-ECR-Role
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t simple-web-app:latest .

      - name: Tag Docker image
        run: docker tag simple-web-app:latest 966127383941.dkr.ecr.eu-north-1.amazonaws.com/simple-web-app:latest

      - name: Push Docker image to ECR
        run: docker push 966127383941.dkr.ecr.eu-north-1.amazonaws.com/simple-web-app:latest